name: Browser checks (manual)

on:
  workflow_call:
    inputs:
      backend_ref:
        required: true
        type: string
      frontend_ref:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Backend commit SHA to check with this frontend
        required: true
        type: string

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require immutable source revisions
        shell: python
        env:
          BACKEND_REF: ${{ inputs.backend_ref }}
          FRONTEND_REF: ${{ inputs.frontend_ref || github.sha }}
        run: |
          import os, re
          for name in ('BACKEND_REF', 'FRONTEND_REF'):
              if not re.fullmatch(r'[0-9a-fA-F]{40}', os.environ[name]):
                  raise SystemExit(name + ' must be an exact 40-character commit SHA')
      - uses: actions/checkout@v6
        with:
          repository: Hjjar-AI/Clinic-frontend
          ref: ${{ inputs.frontend_ref || github.sha }}
          path: frontend
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: Hjjar-AI/Clinic-backend
          ref: ${{ inputs.backend_ref }}
          path: backend
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '12.10.1'
          package_json_file: frontend/package.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: ./backend/.github/actions/native-dependencies
      - run: python -m pip install -r backend/requirements/sqlite.txt
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - name: Record paired revisions
        shell: bash
        run: |
          git -C frontend rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git -C backend rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Run isolated browser workflows
        working-directory: frontend
        env:
          CLINIC_TEST_PYTHON: python
        run: pnpm test:e2e
      - name: Retain synthetic failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-${{ github.run_id }}
          path: frontend/.test-artifacts/playwright/
          retention-days: 7
          if-no-files-found: ignore
