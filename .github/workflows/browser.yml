name: Browser checks (manual)
'on':
  workflow_call:
    inputs:
      backend_ref:
        required: true
        type: string
      frontend_ref:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Backend commit SHA to check with this frontend
        required: true
        type: string
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - name: Require immutable source revisions
      shell: python
      env:
        BACKEND_REF: ${{ inputs.backend_ref }}
        FRONTEND_REF: ${{ inputs.frontend_ref || github.sha }}
      run: |
        import os, re
        for name in ('BACKEND_REF', 'FRONTEND_REF'):
            if not re.fullmatch(r'[0-9a-fA-F]{40}', os.environ[name]):
                raise SystemExit(name + ' must be an exact 40-character commit SHA')
      id: require_immutable_source_revisions
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        repository: Hjjar-AI/Clinic-frontend
        ref: ${{ inputs.frontend_ref || github.sha }}
        path: frontend
        persist-credentials: false
      id: checkout
    - name: Record checked-out revisions
      shell: python
      env:
        CI_REPOSITORIES: '{"frontend": "frontend"}'
      run: |
        import json, os, re, subprocess
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
            summary.write('### Checked-out source revisions\n\n')
            for name, directory in json.loads(os.environ['CI_REPOSITORIES']).items():
                result = subprocess.run(['git', '-C', directory, 'rev-parse', '--verify', 'HEAD'], capture_output=True, text=True, check=True, timeout=10)
                sha = result.stdout.strip()
                if not re.fullmatch(r'[0-9a-fA-F]{40}', sha):
                    raise SystemExit('Invalid checked-out revision')
                summary.write(f'- {name}: `{sha}`\n')
      id: record_checked_out_revisions
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        repository: Hjjar-AI/Clinic-backend
        ref: ${{ inputs.backend_ref }}
        path: backend
        persist-credentials: false
      id: checkout_2
    - name: Record checked-out revisions
      shell: python
      env:
        CI_REPOSITORIES: '{"backend": "backend"}'
      run: |
        import json, os, re, subprocess
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
            summary.write('### Checked-out source revisions\n\n')
            for name, directory in json.loads(os.environ['CI_REPOSITORIES']).items():
                result = subprocess.run(['git', '-C', directory, 'rev-parse', '--verify', 'HEAD'], capture_output=True, text=True, check=True, timeout=10)
                sha = result.stdout.strip()
                if not re.fullmatch(r'[0-9a-fA-F]{40}', sha):
                    raise SystemExit('Invalid checked-out revision')
                summary.write(f'- {name}: `{sha}`\n')
      id: record_checked_out_revisions_2
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: 12.10.1
        package_json_file: frontend/package.json
      id: action_setup
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24.21.0
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml
      id: setup_node
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.14'
        cache: pip
        cache-dependency-path: |
          backend/requirements.txt
          backend/requirements/*.txt
      id: setup_python
    - uses: ./backend/.github/actions/native-dependencies
      id: native_dependencies
    - run: python -m pip install -r backend/requirements/sqlite.txt
      id: install_dependencies
    - run: pnpm install --frozen-lockfile
      working-directory: frontend
      id: install_frontend
    - run: pnpm exec playwright install --with-deps chromium
      working-directory: frontend
      id: step_12
    - name: Run isolated browser workflows
      working-directory: frontend
      env:
        CLINIC_TEST_PYTHON: python
      run: pnpm test:e2e
      id: run_isolated_browser_workflows
    - name: Retain synthetic failure evidence
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: browser-failures-${{ github.run_id }}
        path: frontend/.test-artifacts/playwright/
        retention-days: 7
        if-no-files-found: ignore
      id: retain_synthetic_failure_evidence
    - name: Summarize results
      if: always()
      shell: python
      env:
        CI_REPOSITORIES: '{"backend": "backend", "frontend": "frontend"}'
        CI_JOB_STATUS: ${{ job.status }}
        CI_STEPS_JSON: ${{ toJSON(steps) }}
      run: |
        import json, os, re, subprocess
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
            summary.write('### Job results\n\n')
            summary.write(f'Runner: {os.environ["RUNNER_OS"]}; status: {os.environ["CI_JOB_STATUS"]}\n\n')
            for name, directory in json.loads(os.environ['CI_REPOSITORIES']).items():
                try:
                    result = subprocess.run(['git', '-C', directory, 'rev-parse', '--verify', 'HEAD'], capture_output=True, text=True, check=True, timeout=10)
                    sha = result.stdout.strip()
                    if not re.fullmatch(r'[0-9a-fA-F]{40}', sha):
                        sha = 'unavailable'
                except (OSError, subprocess.SubprocessError):
                    sha = 'unavailable'
                summary.write(f'- {name}: `{sha}`\n')
            for name in ('BACKEND', 'FRONTEND'):
                sha = os.environ.get('CI_EXPECTED_' + name + '_SHA', '')
                if sha:
                    sha = sha if re.fullmatch(r'[0-9a-fA-F]{40}', sha) else 'unavailable'
                    summary.write(f'- requested {name.lower()}: `{sha}`\n')
            summary.write('\n| Step | Outcome |\n| --- | --- |\n')
            artifacts = []
            for name, step in json.loads(os.environ['CI_STEPS_JSON']).items():
                outcome = step.get('outcome', step.get('result', 'unknown'))
                summary.write(f'| {name} | {outcome} |\n')
                outputs = step.get('outputs', {})
                artifact_id = str(outputs.get('artifact-id', ''))
                url = outputs.get('artifact-url', '')
                if re.fullmatch(r'[0-9]+', artifact_id):
                    label = f'{name}: artifact {artifact_id}'
                    artifacts.append(f'- [{label}]({url})' if re.fullmatch(r'https://github\.com/[\w./-]+', url) else f'- {label}')
            summary.write('\nUploaded artifacts:\n\n' + '\n'.join(artifacts or ['- None recorded for this job.']) + '\n')
