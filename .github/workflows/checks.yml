name: Frontend checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '12.10.1'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build
      - name: Retain frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ runner.os }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
