name: Dependency vulnerability report

on:
  push:
    paths: [package.json, pnpm-lock.yaml, .github/workflows/dependency-audit.yml]
  pull_request:
    paths: [package.json, pnpm-lock.yaml, .github/workflows/dependency-audit.yml]
  schedule:
    - cron: '47 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '12.10.1'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Report known vulnerabilities without changing dependencies
        run: pnpm audit --json > dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-dependency-audit-${{ github.run_id }}
          path: dependency-audit.json
          retention-days: 14
          if-no-files-found: warn
